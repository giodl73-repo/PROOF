name: Markdown workbench
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install tools
        run: |
          rustup show
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate Rust
        run: |
          cargo fmt --all --check
          cargo test --locked -p proof-core -p proof-web -p proof-math -p proof-canvas
          cargo clippy --locked -p proof-core -p proof-web -p proof-math -p proof-canvas --all-targets -- -D warnings
      - name: Build Pages and test browser
        run: |
          python tools/build-pages.py
          npm run test:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/PROOF
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
