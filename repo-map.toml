# Local tracker repo map for generated Cargo dependency overrides.
# Cargo does not read this file directly; run:
#
#   python tools\repo_map.py write-cargo-config
#

[standard]
version = 1
cargo_config = ".cargo/config.toml"

[repos.this_repo]
role = "current repository"
relative = "."
clone_url = "https://github.com/giodl73-repo/MDLOOM.git"

[repos.mdpath]
role = "tracker dependency for mdloom"
relative = "..\\..\\standards-protocols\\mdpath"
clone_url = "https://github.com/giodl73-repo/MDPATH.git"
cargo_patches = [
  { package = "mdpath", source = "https://github.com/giodl73-repo/MDPATH", path = "." },
]

[repos.mdcrop]
role = "corpus-intelligence CLI and schema dependency"
relative = "..\\mdcrop"
canonical = "giodl73-repo/MDCROP"
clone_url = "https://github.com/giodl73-repo/MDCROP.git"
required_by = ["src/cmd_mdcrop.rs", "src/compile_mdcrop.rs", "tests/integration_tests.rs"]
